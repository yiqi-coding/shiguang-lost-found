# =============================================================================
# 拾光 · 校园地点层级表（虚构校园，无任何真实机构信息）
# -----------------------------------------------------------------------------
# 结构：campus → buildings → floors → spots
#   - code            唯一编码，用于评分时比较层级
#   - aliases         中文别名（解析函数按「最长别名优先」匹配）
#   - adjacent_buildings  相邻建筑关系（互为相邻；解析时会自动补全对称关系）
#   - adjacent_campuses   相邻校区（下同）
# 地点解析：app/locations.py 只读本文件的 campus/building/floor/spot 词表，
#          解析不出任何层级 → 视为 unknown（中性分），绝不抛异常。
# 评分：output.tiers 只在这里定义，代码只做「tier → score」查表。
# =============================================================================

version: "1.0"
campus_name: "拾光大学（虚构）"
note: "全部校区、建筑、楼层、地点点均为演示用虚构信息，与任何真实校园无关。"

