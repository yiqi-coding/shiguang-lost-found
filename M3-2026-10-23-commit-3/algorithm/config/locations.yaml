# -----------------------------------------------------------------------------
# 二、评分档位（代码只读这里的 tier → score 映射）
# -----------------------------------------------------------------------------
output:
  tiers:
    same_spot: 1.00        # 同一具体地点（同校区+同建筑+同楼层+同 spot）
    same_floor: 1.00      # 同校区+同建筑+同楼层（spot 未指明或不同 spot）
    same_building_diff_floor: 0.85   # 同一建筑不同楼层
    adjacent_building: 0.60          # 相邻建筑（同校区）
    same_campus_far: 0.35            # 同一校区较远地点
    cross_campus: 0.10               # 不同校区
    unknown: 0.50                    # 任一侧解析失败 / 缺失 → 中性分
  tier_labels:
    same_spot: 同一具体地点
    same_floor: 同一建筑同一楼层
    same_building_diff_floor: 同一建筑不同楼层
    adjacent_building: 相邻建筑
    same_campus_far: 同一校区较远地点
    cross_campus: 不同校区
    unknown: 地点未知
  # 解析规则
  parsing:
    longest_alias_first: true
    # 楼层可由「三楼 / 3楼 / 3层 / F3 / 三楼阅览室」等表达解析
    floor_patterns:
      - "([一二三四五六七八九十0-9]{1,2})(?:楼|层)"
      - "F([0-9]{1,2})"
    # 只有以下 spot 词不参与建筑判定（避免把「三食堂」错判为 spot）
    spot_only_keywords: true

