# =============================================================================
# 拾光 · Nginx 配置（前端静态资源 + API 反向代理）
# =============================================================================

# 上游后端（容器名由 docker compose 提供 DNS 解析）
upstream shiguang_backend {
    server backend:8000;
    keepalive 16;
}

# HTTP：生产环境应重定向到 HTTPS（由云负载均衡或下方 443 段处理）
server {
    listen 80;
    server_name _;

    # 与后端 UPLOAD_MAX_SIZE_MB=10 对齐，留出 multipart 边界开销
    client_max_body_size 12m;
    client_body_timeout 60s;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 注意：Content-Security-Policy 需按实际引入的资源调整后再启用
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.myhuaweicloud.com" always;

    # 不暴露 Nginx 版本号
    server_tokens off;

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------------------------------------------------------------- 前端
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA history 路由回退
        try_files $uri $uri/ /index.html;

        # 带 hash 的构建产物可长期缓存，index.html 不缓存
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://shiguang_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 上传接口单独放宽（见下方 location /api/v1/items）
        proxy_request_buffering on;
    }

    # 图片上传：放宽超时与缓冲
    location = /api/v1/items {
        limit_except POST { deny all; }
        proxy_pass http://shiguang_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 12m;
    }

    # 本地存储后端的静态图片（STORAGE_BACKEND=local 时使用；OBS 模式不经过这里）
    location /static/objects/ {
        alias /app/storage/;
        expires 7d;
        add_header Cache-Control "private";
        # 禁止目录列表
        autoindex off;
    }

    # ---------------------------------------------------------------- 健康检查
    location = /health {
        proxy_pass http://shiguang_backend/health;
        access_log off;
    }

    location = /health/live {
        proxy_pass http://shiguang_backend/health/live;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://shiguang_backend/health/ready;
        access_log off;
    }

    # ---------------------------------------------------------------- 其他
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /admin\nDisallow: /api/\n";
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
        access_log off;
    }
}

