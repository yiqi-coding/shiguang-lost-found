# =============================================================================
# Alembic 配置（拾光 · 后端）
# -----------------------------------------------------------------------------
# 使用方式（在 backend/ 目录下执行）：
#   alembic upgrade head        # 应用迁移（等价于 scripts/init_db.sql 的建表效果）
#   alembic downgrade -1        # 回滚一步
#   alembic current             # 查看当前版本
#   alembic revision --autogenerate -m "add xxx"   # 模型变更后生成新迁移
#
# ⚠ 数据库连接串**不写在本文件里**：真实值来自 `app.core.config.settings.DATABASE_URL`
#   （环境变量 / .env），由 alembic/env.py 在运行时注入，避免把密码提交进仓库。
# ⚠ 规则：永不修改已合入的迁移文件，只追加新迁移；每个迁移必须同时实现
#   upgrade() 与 downgrade()（见 docs/database-design.md §6.2）。
# =============================================================================

[alembic]
# 迁移脚本目录（相对于本文件所在目录）
script_location = alembic

# 让 `alembic` 能 import 到 app 包
prepend_sys_path = .

# 版本文件名模板：0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# 时间戳（UTC）
timezone = UTC

# 迁移文件名中的 rev 前缀长度（保持与 database-design.md §6.1 一致的 “0001_”
truncate_slug_length = 60

# 连接串留空：由 env.py 用 settings.DATABASE_URL 覆盖
sqlalchemy.url =

# 离线模式输出（stdout / 文件）
output_encoding = utf-8

# -----------------------------------------------------------------------------
# 日志配置
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
