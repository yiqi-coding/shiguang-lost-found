# =============================================================================
# 拾光 · 匹配算法唯一配置源 (single source of truth)
# -----------------------------------------------------------------------------
# 本文件是「权重 / 阈值 / 规则词表」的唯一来源。app/ 下的任何模块都不得硬编码
# 权重数字；所有分值都必须通过 app/config_loader.py 从这里读取。
# 若本文件不可读或缺少字段，config_loader 会退回到 BUILTIN_FALLBACK（数值与本
# 文件保持一致），并在 RuntimeConfig.warnings 中记录告警，绝不抛异常中断服务。
# =============================================================================

version: "baseline-1.0"
model_version: "baseline-1.0"

# -----------------------------------------------------------------------------
# 1. 总分权重
#    总分 = 0.20×类别 + 0.25×属性/文本 + 0.20×图像 + 0.15×时间 + 0.15×地点 + 0.05×品牌型号
#    总分 = Σ(权重 × 维度分) + Σ冲突惩罚（见 rules.adjustments，默认全为 0）
# -----------------------------------------------------------------------------
weights:
  category: 0.20
  text: 0.25
  image: 0.20
  time: 0.15
  location: 0.15
  brand_model: 0.05

scoring:
  normalize_min: 0.0
  normalize_max: 1.0
  max_results: 20                # 默认返回条数上限（可被请求体 top_k 覆盖）
  clamp_min: 0.0                 # 每个维度分计算前的兜底夹取区间
  clamp_max: 1.0

# 缺失信息时的中性分（可配置）。任何维度缺数据 → 取该维度的中性分，不抛异常。
neutral_scores:
  category: 0.50
  text: 0.50
  image: 0.50
  time: 0.50
  location: 0.50
  brand_model: 0.50

rules:
  # ---------------------------------------------------------------------------
  # 2. 类别分
  # ---------------------------------------------------------------------------
  category:
    aliases:                     # 归一化别名 → 规范类别（用于「同一类别」判定）
      蓝牙耳机: 无线耳机
      无线蓝牙耳机: 无线耳机
      耳机: 无线耳机
      airpods: 无线耳机
      保温杯: 水杯
      杯子: 水杯
      水壶: 水杯
      教材: 书籍
      课本: 书籍
      书本: 书籍
      专业书: 书籍
      一卡通: 校园卡
      学生卡: 校园卡
      饭卡: 校园卡
      学生证: 校园卡
      证件卡: 校园卡
      折叠伞: 雨伞
      自动伞: 雨伞
      双肩包: 背包
      书包: 背包
      电脑包: 背包
      充电仓: 充电盒
    same_category_score: 1.0
    same_family_score: 0.60      # 同族不同类（见 families）
    related_score: 0.25          # related_pairs 中声明为相关
    mismatch_score: 0.0
    families:                    # 同族：并不同类但语义接近
      - [无线耳机, 充电盒]
      - [校园卡, 证件卡]
    related_pairs:
      - [背包, 雨伞]
      - [书籍, 校园卡]

  # ---------------------------------------------------------------------------
  # 3. 属性/文本分（字符 n-gram + 关键词重叠 + 词表属性，纯确定性算法）
  # ---------------------------------------------------------------------------
  text:
    component_weights:           # 三个子项融合权重（内部再归一化）
      char_ngram: 0.30           # 描述文本字符 n-gram 相似度
      keyword_overlap: 0.25      # 关键词 / 标题词重叠
      attribute_match: 0.45      # 颜色 / 材质 / 特征词表属性匹配（区分度最高）
    ngram_sizes: [2, 3]          # 中文用 2-gram + 3-gram
    ngram_similarity: dice       # dice(2ab/(a+b)) 或 jaccard
    min_text_length: 2           # 短于此长度的文本视为缺失 → 中性分
    color_score: 1.0
    color_conflict_score: 0.10
    color_partial_score: 0.60    # 一方颜色是另一方子串（如「黑」vs「黑色」）
    material_score: 1.0
    material_conflict_score: 0.20
    material_neutral: 0.50
    feature_pair_threshold: 0.42 # 单条特征相似度 ≥ 该值视为命中
    feature_pairs_weight: 0.60   # attribute_match 内：特征成对得分权重
    feature_attr_weight: 0.40    # attribute_match 内：颜色+材质得分权重
    brand_hint_weight: 0.15      # 描述文本中出现对方品牌的加分
    # 硬性上限（gate）：出现明确冲突时，属性/文本分不得高于对应上限，
    # 避免「颜色不同但文案相似」被误判为高相似。
    max_text_score_on_color_conflict: 0.65
    max_text_score_on_material_conflict: 0.80
    max_text_score_on_feature_mismatch: 0.70   # 特征覆盖率 < feature_gate_coverage 时生效
    feature_gate_coverage: 0.60                # 双向特征覆盖率阈值（归入文本分）
    calibration:                 # 融合相似度 → 文本分（保留部分匹配语义）
      - {min: 0.62, score: 1.00}
      - {min: 0.46, score: 0.85}
      - {min: 0.30, score: 0.62}
      - {min: 0.15, score: 0.42}
      - {min: 0.00, score: 0.25}

  # ---------------------------------------------------------------------------
  # 4. 图像相似度（可插拔接口 + 确定性 Mock；真实模型接入见 image.backend 与
  #    app/matcher.py 的 register_image_embedder 注释）
  # ---------------------------------------------------------------------------
  image:
    backend: "mock"              # mock | huawei_maas | clip | <自定义注册名>
    dimension: 64                # MockEmbedder 伪向量维度
    seed: "shiguang-image-v1"    # 稳定哈希种子（改动会改变所有 Mock 向量）
    min_similarity: 0.0
    max_similarity: 1.0
    similarity_scale: 1.0        # score = (cos+1)/2 * scale
    text_fallback_fields: [category, title, description]   # 无图片时的兜底文本特征
    # Mock 后端的「伪视觉词袋」权重：只取与外观强相关的规范属性，不掺入发文措辞，
    # 因此同一件物品（同类别/同颜色/同品牌/同特征）会得到高相似度，而不同物品较低。
    mock_token_weights:
      category: 3.0
      color: 2.0
      brand: 1.5
      model: 1.5
      material: 1.0
      features: 2.0
      accessories: 0.5
      image_name: 2.0
    mock_debug: false

  # ---------------------------------------------------------------------------
  # 5. 品牌 / 型号分
  # ---------------------------------------------------------------------------
  brand_model:
    weight_brand: 0.60           # 品牌分占该维度的权重
    weight_model: 0.40           # 型号分占该维度的权重
    brand_exact_score: 1.0
    brand_alias_score: 0.85      # 命中 brand_aliases（同一品牌不同写法）
    brand_unknown_neutral: 0.50  # 一方缺失 → 中性分（并产出 uncertainties）
    brand_conflict_score: 0.05   # 双方都有但不同 → 强负信号
    model_exact_score: 1.0
    model_partial_score: 0.70    # 一方型号是另一方子串
    model_unknown_neutral: 0.50
    model_conflict_score: 0.15
    brand_aliases:               # 归一化后的别名映射
      airpods: apple
      apple: apple
      苹果: apple
      华为: huawei
      huawei: huawei
      荣耀: honor
      honor: honor
      小米: xiaomi
      xiaomi: xiaomi
      redmi: 红米
      红米: 红米
      漫步者: edifier
      edifier: edifier
      索尼: sony
      sony: sony
      森海塞尔: sennheiser
      膳魔师: thermos
      象印: zojirushi
      富光: fuguang
      得力: deli
      晨光: mg
      乐扣乐扣: locknlock
      乐扣: locknlock
      天堂伞: 天堂
      天堂: 天堂
      网易严选: 网易严选
      京东京造: 京东京造
      无印良品: muji
      muji: muji
      迪卡侬: decathlon
      安踏: anta
      李宁: lining
      耐克: nike
      斑马: zebra
      三菱: mitsubishi

  # ---------------------------------------------------------------------------
  # 6. 冲突惩罚 / 加分（默认全部 0.0，即总分严格等于加权和）
  # ---------------------------------------------------------------------------
  adjustments:
    conflict_penalty:
      brand_conflict: 0.0        # 双方品牌明确冲突
      model_conflict: 0.0
      category_conflict: 0.0
    bonus:
      hidden_feature_hit: 0.0    # 隐藏特征命中（默认关闭，留作扩展）

  # ---------------------------------------------------------------------------
  # 7. 时间合理度：分段函数（时间差越小越高）。单位统一为小时。
  #    兼容「失物时间范围 vs 拾取单点时间」：range 表示区间，point 表示单点，
  #    range vs point 时取「点到区间的最短距离」作为时间差。
  # ---------------------------------------------------------------------------
  time:
    unit: hour
    range_mode: point_to_range_shortest
    low_diff_score: 1.00         # 完全落在合理区间内的下限
    fallback_score: 0.10         # 超出所有分段后的兜底分
    segments:
      - {name: within_2h,   max_diff: 2.0,  score: 1.00, interpolation: flat}
      - {name: 2h_to_12h,   max_diff: 12.0, score: 0.80, interpolation: linear}
      - {name: 12h_to_24h,  max_diff: 24.0, score: 0.60, interpolation: step}
      - {name: 24h_to_72h,  max_diff: 72.0, score: 0.30, interpolation: step}
      - {name: beyond_72h,  max_diff: null, score: 0.10, interpolation: flat}
    event_time_formats:          # 允许的输入格式（逐个尝试，全部失败 → unknown）
      - "%Y-%m-%dT%H:%M:%S"
      - "%Y-%m-%dT%H:%M"
      - "%Y-%m-%d %H:%M:%S"
      - "%Y-%m-%d %H:%M"
      - "%Y/%m/%d %H:%M:%S"
      - "%Y/%m/%d %H:%M"
      - "%Y-%m-%d"
      - "%Y/%m/%d"

  # ---------------------------------------------------------------------------
  # 8. 文本归一化与关键词抽取词表（extractor.py / text_utils.py 只读配置）
  # ---------------------------------------------------------------------------
  text_normalization:
    fullwidth_to_halfwidth: true
    lowercase: true
    strip_whitespace: true       # 去掉所有空白
    strip_punctuation: true      # 去掉中英文标点
    max_length: 200

  category_keywords:             # 规范类别 → 触发词（最长词优先）
    无线耳机: [无线耳机, 蓝牙耳机, 蓝牙, airpods, 充电盒, 耳机盒, 耳塞, 耳机]
    水杯: [保温杯, 吸管杯, 马克杯, 玻璃杯, 茶杯, 水杯, 杯子, 水壶]
    书籍: [专业书, 参考书, 习题集, 教材, 课本, 书本, 书籍, 笔记]
    校园卡: [校园卡, 一卡通, 学生卡, 借阅卡, 饭卡, 学生证]
    雨伞: [折叠伞, 长柄伞, 自动伞, 雨伞, 伞]
    背包: [双肩包, 电脑包, 旅行包, 帆布包, 书包, 背包]
    证件卡: [身份证件, 身份证, 证件]
    充电盒: [耳机充电盒, 充电仓]

  brand_keywords:                # 品牌词表（抽取 + 归一化）
    - Apple
    - 苹果
    - AirPods
    - 华为
    - HUAWEI
    - 荣耀
    - 小米
    - 红米
    - Redmi
    - 漫步者
    - Edifier
    - 索尼
    - SONY
    - 森海塞尔
    - 膳魔师
    - 象印
    - 富光
    - 得力
    - 晨光
    - 乐扣乐扣
    - 天堂伞
    - 天堂
    - 网易严选
    - 京东京造
    - 无印良品
    - MUJI
    - 迪卡侬
    - 安踏
    - 李宁
    - 耐克
    - 斑马
    - 三菱

  color_keywords:                # 颜色词表（值中的第一个词为规范名）
    黑色: [黑色, 黑, 曜石黑, 深黑, 哑光黑, black]
    白色: [白色, 白, 米白, 象牙白, 珍珠白, white]
    银色: [银色, 银, 银灰, silver]
    灰色: [灰色, 灰, 深灰, 浅灰, gray, grey]
    蓝色: [蓝色, 蓝, 深蓝, 天蓝, 藏青, blue]
    红色: [红色, 红, 酒红, 大红, red]
    绿色: [绿色, 绿, 墨绿, 草绿, green]
    黄色: [黄色, 黄, 米黄, 鹅黄, yellow]
    粉色: [粉色, 粉, 藕粉, pink]
    紫色: [紫色, 紫, 香芋紫, purple]
    棕色: [棕色, 咖色, 咖啡色, 卡其, 驼色, brown]
    透明: [透明, 半透明, transparent]

  material_keywords:
    塑料: [塑料, 塑胶, 树脂, abs]
    金属: [金属, 铝合金, 铝, 铁]
    不锈钢: [不锈钢, 304]
    硅胶: [硅胶, 橡胶, 软胶]
    玻璃: [玻璃, 钢化玻璃]
    皮革: [皮革, 真皮, 人造革, pu皮]
    帆布: [帆布, 牛津布]
    尼龙: [尼龙, 涤纶, 聚酯]
    陶瓷: [陶瓷, 骨瓷]
    纸: [纸质, 纸张, 硬壳纸]

  feature_patterns:              # 「可见特征」抽取规则（前缀 + 关键词 + 后缀，尽量短而准）
    - {pattern: "(?:盒盖内侧|盒体|盒盖|杯盖|杯底|杯身|伞面|伞柄|书脊|扉页|卡面|卡套|肩带|内衬|内袋|背面|侧面|内侧)?(?:划痕|刮痕|划伤|刮花)", label: 划痕类}
    - {pattern: "(?:盒盖内侧|盒体|盒盖|杯盖|杯底|杯身|伞面|伞柄|书脊|扉页|卡面|卡套|肩带|内衬|内袋|背面|侧面|内侧)?(?:磨损|磨痕|磕碰|凹痕|裂纹|缺口|破损|裂缝|掉漆|褪色|变形|脱线|开线)", label: 损伤类}
    - {pattern: "(?:杯底|杯盖内|内壁|内衬|卡面|书页|伞面)?(?:污渍|水渍|茶渍|斑点|霉点)", label: 污损类}
    - {pattern: "(?:贴有|印有|绣有|刻有)?(?:贴纸|贴画|挂件|钥匙扣|挂饰|吊牌|标签|姓名贴|书签|票根|徽章|胶带|红绳|登山扣)", label: 附着物类}
    - {pattern: "(?:印有|写有|刻有|盖有|夹有)?(?:logo|标志|标识|字样|姓名|名字|编号|学号|缩写)", label: 标识类}
    - {pattern: "(?:圆形|椭圆形|方形|长方形|三角形|圆筒形|圆柱形|鹅卵石形|扁平|长条)(?:充电盒|充电仓|杯身|外形|款式)?", label: 形状类}
    - {pattern: "(?:卡通|字母|花纹|校徽|刺绣)?(?:图案|卡通|花纹|校徽|刺绣|刺绣标)", label: 图案类}

  accessory_keywords:
    充电盒: [充电盒, 充电仓, 耳机盒, 电池仓]
    耳机: [左右耳机, 左右耳, 单只耳机, 耳机, 耳塞]
    数据线: [数据线, 充电线, type-c, typec]
    充电器: [充电器, 充电头, 适配器, 插头]
    说明书: [说明书, 保修卡, 使用手册]
    杯盖: [杯盖, 盖子, 杯塞, 吸管盖]
    吸管: [吸管, 搅拌棒, 茶漏]
    卡套: [卡套, 卡包, 保护套]
    钥匙: [钥匙串, 门钥匙, 钥匙扣, 钥匙]
    笔记本: [笔记本, 本子, 硬抄本]
    笔: [中性笔, 铅笔, 记号笔, 笔]
    文具袋: [文具袋, 笔袋, 文具盒]
    伞套: [伞套, 伞袋, 收纳袋]
    挂绳: [挂绳, 挂带, 腕带, 手绳]
    行李牌: [行李牌, 姓名牌, 吊牌]
    水杯: [水杯, 杯子, 保温杯]

  keyword_rules:
    max_keywords: 12
    min_length: 2
    max_length: 12
    include_source_tags: [category, color, brand, material, accessory, feature]
    generic_stopwords: [东西, 物品, 一个, 我的, 这个, 那个, 同学, 今天, 昨天, 上面, 下面, 里面, 外面, 附近, 旁边, 已经, 好像, 大概, 应该, 可能, 有点, 非常, 特别, 就是, 还有, 发现, 捡到, 丢失, 遗失, 拾到, 疑似, 一道, 两处, 一处]
    # 名词短语里出现这些虚词/助词就丢弃，避免抽出「内侧疑似有一道」这类噪声
    noun_phrase_stopchars: [的, 了, 一, 两, 有, 是, 这, 那, 个, 就, 还, 也, 都, 很, 要, 和, 与, 在, 把, 被, 给, 对, 从, 到, 而, 但, 或, 及, 以, 为, 之, 其, 我, 你, 他, 她, 它, 们, 上, 下, 里, 外, 中, 内, 侧, 似, 疑, 看, 清, 原, 因, 所, 会, 能, 可, 请, 让, 使, 被, 于, 并, 则, 若, 如, 见, 到, 过, 着, 呢, 吧, 吗, 啊]
    noun_phrase_enabled: true
    noun_phrase_length: [2, 5]

  uncertainty_markers:          # 出现这些词的属性只作为「推测」并进入 uncertainties
    - 疑似
    - 好像
    - 似乎
    - 大概
    - 可能
    - 不确定
    - 记不清
    - 应该是
    - 大约
    - 模糊
    - 看不清
    - 不清晰
    - 印象中
